[STORAGE]
# Base directory for all recordings
base_dir = /media/share/cameras/cctv-storage

# Temporary directory for staging files before moving
temp_dir = /tmp/cctv_staging

# Number of days to keep recordings (older than this will be deleted)
retention_days = 10

# How often to check for old files (in hours)
cleanup_interval_hours = 6

[RECORDING]
# Duration of each video segment in seconds
segment_duration = 300

# Maximum number of detection images per session
max_images_per_session = 3

[NETWORK]
# Port for the Flask web server
flask_port = 5000
