# ==============================================================================
# CCTV IMAGE DETECTOR CONFIGURATION
# ==============================================================================
# Edit values carefully.
# Most changes require restarting the detector service to take effect.
# Time values are expressed in seconds unless otherwise noted.
#
# sudo systemctl restart cctv-image-detector.service
# ==============================================================================


[GENERAL]

# Controls how often YOLO analyzes a new frame from each camera (seconds)
ANALYSIS_INTERVAL = 2.5

# Number of images captured and uploaded per detection session
MAX_IMAGES = 3

# Seconds to wait after a session ends or reset before allowing a new detection
# Reduced from 5.0 to 0.5 seconds - the 3-minute gap was caused by cooldown blocking detections
COOLDOWN = 0.5

# Delay between camera frame capture attempts (seconds)
CAM_THREAD_SLEEP = 0.05

# Port used by the Flask webhook server for recorder reset notifications
WEBHOOK_PORT = 5001

# enabled or disable sent emails
ENABLE_EMAIL_ALERTS = True

# Minimum seconds between collecting frames for same session
# Reduced from 1.0 to 0.2 seconds to collect frames faster during active sessions
MIN_COLLECTION_INTERVAL = 0.2 


[YOLO]

# Minimum confidence score (0-1). Lower values increase sensitivity but may create more false positives
CONFIDENCE = 0.55

# Frame size used for YOLO inference (frame is resized to INPUT_SIZE x INPUT_SIZE)
INPUT_SIZE = 480

# Intersection-over-Union threshold used by Non-Maximum Suppression (NMS)
IOU = 0.40

# Seconds to wait before restarting a crashed YOLO worker process
RESTART_DELAY = 5


[FILTERS]

# Reject detections whose bounding box area is smaller than the configured threshold
ENABLE_AREA_FILTER = true

# Reject detections whose height/width ratio falls outside allowed limits
ENABLE_ASPECT_FILTER = true

# Reject detections touching the top edge of the image unless confidence is very high
ENABLE_TOP_EDGE_FILTER = true

# Reject detections that fall inside a fixed ignore region (see [CAMERA_EXCLUDE_ZONE]).
# Use this for static false positives at a permanent location (clutter, fixtures,
# a hanging clothes rack) that score as "person". Runs at ALL confidence levels.
ENABLE_EXCLUDE_ZONE_FILTER = true

# Fraction (0-1) of a detection box that must lie inside an exclude zone to reject it.
# Higher = stricter (box must be almost entirely inside the zone). 0.6 = reject when
# at least 60% of the box is in the zone, so a person clipping the edge still detects.
EXCLUDE_ZONE_COVERAGE = 0.6

# Default minimum bounding box area for a valid person detection (pixels)
MIN_PERSON_AREA = 600

# Minimum allowed height-to-width ratio for a person
MIN_ASPECT_RATIO = 1.2

# Maximum allowed height-to-width ratio for a person
MAX_ASPECT_RATIO = 4.0

# Minimum confidence required to keep a detection valid even the ratio is out of range
# Only apply to detections with confidence < 0.75
FILTER_CONFIDENCE  = 0.80

# Number of pixels from the top edge considered suspicious
TOP_EDGE_MARGIN = 20

# Minimum confidence required to keep a detection near the top edge
TOP_EDGE_HIGH_CONF = 0.60

# Dark Pixel Filter - rejects false positives with too many dark pixels (shadows, noise)
# Enable/disable (true/false)
ENABLE_DARK_FILTER = true       

# Pixel value < this = dark (0-255)
DARKNESS_THRESHOLD = 50         

# Reject if >70% of pixels are dark
DARK_PIXEL_RATIO = 0.70          

# Only apply to detections with confidence < 0.6
DARK_FILTER_MIN_CONF = 0.6      


[SESSION]

# Force reset sessions that remain active without activity for this many seconds
########### Reduced from 300 to 30 seconds - don't wait 5 minutes to reset a stale session
SESSION_TIMEOUT = 300

# Force reset sessions stuck waiting for recorder confirmation
########### Reduced from 300 to 15 seconds - watchdog should act faster
WATCHDOG_TIMEOUT = 300

# How often the watchdog checks for stuck or timed-out sessions (seconds)
############ Reduced from 10 to 2 seconds - check for stuck sessions more frequently
WATCHDOG_CHECK = 12

# Ignore duplicate recorder reset signals received within this time window (seconds)
RESET_DEDUP_WINDOW = 2


[UPLOAD]

# Number of worker threads used for image uploads
UPLOAD_WORKERS = 2

# Maximum number of pending uploads allowed before new uploads are dropped
UPLOAD_QUEUE_SIZE = 20

# Maximum number of upload retry attempts after a failure
UPLOAD_MAX_RETRIES = 3

# Base delay between upload retries (seconds)
UPLOAD_RETRY_DELAY_BASE = 2

# Maximum number of frames waiting for YOLO processing
TASK_QUEUE_SIZE = 10

# Maximum number of completed YOLO results waiting to be processed
RESULT_QUEUE_SIZE = 20


[DEBUG]

# Enable detailed debug logging for rejected detections and filter decisions
ENABLE_DEBUG_PRINTS = true

# Minimum time between repeated debug messages of the same type (seconds)
DEBUG_LOG_INTERVAL = 300

# Save images rejected by filters for troubleshooting and tuning
SAVE_REJECTED_IMAGES = true

# Minimum time between saving rejected images of the same type per camera (seconds)
SAVE_IMAGE_INTERVAL = 300  

# Directory where rejected detection images are stored
REJECTED_IMAGES_DIR = /home/pi/cctv_rejected

# Maximum number of rejected images to keep before rotating old files
MAX_REJECTED_IMAGES = 100


[IMAGE]

# JPEG compression quality (1-100). Higher values increase image quality and file size
JPEG_QUALITY = 80

# Draw bounding boxes and labels on uploaded images
DRAW_BOUNDING_BOXES = true

# Draw the per-camera exclusion zones (orange, see [CAMERA_EXCLUDE_ZONE]) on
# rejected images and rejection emails — useful for tuning zone coordinates.
DRAW_ZONES = true



# Minimum person detection area (pixels) for each camera
[CAMERA_MIN_AREA]
Gate = 680
Center = 680
Entrance = 680
Garage = 680
Behind = 680
Left = 680   


# Maximum person detection area (pixels) for each camera.
# Helps reject large false positives such as headlights, vehicles, or close-up objects.
[CAMERA_MAX_AREA]
 gate = 150000        
 center = 150000      
 entrance = 150000
 garage = 150000
 behind = 150000      
 left = 150000


# Allowed height-to-width ratio range for person detections.
# Format: minimum_ratio,maximum_ratio
[CAMERA_ASPECT_RATIO]
gate = 0.8,5.0
center = 0.8,5.0
entrance = 0.8,5.0
garage = 0.8,5.0
behind = 0.8,5.0
left = 0.8,5.0      



# Top-Edge Filter - Per Camera Settings
# Format: margin,high_conf
[TOP_EDGE_CONFIG]
Gate = 20,0.65
Center = 0,0.0
Entrance = 0,0.0
Garage = 0,0.0
Behind = 20,0.0
Left = 20,0.65

# Per-camera exclusion zones — detections whose box is mostly inside one of
# these rectangles are rejected (see ENABLE_EXCLUDE_ZONE_FILTER / EXCLUDE_ZONE_COVERAGE).
# Use for static false positives at a fixed location (clutter, fixtures).
# Coordinates are pixels in the captured frame (640x360), top-left origin.
# Format: x1,y1,x2,y2   (multiple zones per camera separated by ';')
# Cameras not listed (or with an empty value) have no exclusion zone.
[CAMERA_EXCLUDE_ZONE]
# Garage: clothes/bag rack in the bottom-left corner reads as PERSON ~0.58.
Garage = 1,85,220,240

# ==========================================
# NIGHTTIME OVERRIDES (only cameras that need different values)
# ==========================================
[NIGHT_CAMERA_MIN_AREA]
Gate = 760
Center = 760
Entrance = 760
Garage = 760
Behind = 760
Left = 760



[NIGHT_CAMERA_MAX_AREA]
# All cameras use daytime defaults (no night overrides)
# cameras more permissive at night
[NIGHT_CAMERA_ASPECT_RATIO]
gate = 1.2,5.0
center = 1.2,5.0
entrance = 1.2,5.0
garage = 1.2,5.0
behind = 1.2,5.0
left = 1.2,5.0

