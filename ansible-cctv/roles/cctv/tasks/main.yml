---
- name: Debug Camera Name
  debug:
    msg: "Attempting to start service for camera: {{ cam_name }}"


- name: Ensure git is installed
  become: yes
  apt:
    name: git
    state: present
    update_cache: yes

- name: Clone or update CCTV repository
  git:
    repo: "{{ git_repo }}"
    dest: "{{ git_dest }}"
    version: main
    force: yes

# --- NEW TASK: Deploy config.ini ---
- name: copy CCTV configuration
  copy:
    src: "../config.ini"        # Make sure this file is in your Ansible project folder
    dest: "/home/pi/cctv/config.ini"
    owner: pi
    group: pi
    mode: '0644'
  register: config_file        # We track if the file changed

# --- Create CCTV config directory first ---
- name: Create CCTV config directory
  become: yes
  file:
    path: /etc/cctv
    state: directory
    owner: pi
    group: pi
    mode: '0755'

# --- deploy credentials ---
- name: copy CCTV credentials
  become: yes
  copy:
    src: "../credentials/recorder/credentials.env"
    dest: "/etc/cctv/credentials.env"
    owner: pi
    group: pi
    mode: '0644'
  register: creds_file

# --- deploy config ---
- name: copy CCTV config
  become: yes
  copy:
    src: "../config.ini"
    dest: "/etc/cctv/config.ini"
    owner: pi
    group: pi
    mode: '0644'
  register: conf_file
  
- name: Restart CCTV recorder service
  become: yes
  systemd:
    name: "cctv-video-recorder@{{ cam_name }}.service"
    state: restarted
    enabled: yes
    daemon_reload: yes

